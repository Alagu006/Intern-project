name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Pytest with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: secure_files_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/secure_files_test
          MASTER_KEK: dGVzdC1tYXN0ZXIta2VrLTMyLWJ5dGVzLWxlbmd0aCE=
          ALLOWED_ORIGINS: http://localhost:3000
          UPLOAD_FOLDER: /tmp/secure_files_test
          UPLOAD_STAGING_DIR: /tmp/secure_files_test_staging
        run: |
          pytest tests/ -v
